<div class="contact-page" id="contact-section">
   <div class="title">
    <h4>Contact </h4>
   </div>
<div class="contact-bar">
   <div class="contact-source">
 
<h3>Let's get in touch</h3>

<div class="contact-platform">
   <div class="mail">
      <div class="mail-icon"><i class="fa fa-envelope" aria-hidden="true"></i></div>
<div class="mail-name" (click)="navigateto()">{{mail}}</div>     
      
   </div>
   
   <div class="phone">
      <div class="phone-icon">
         <i class="fa fa-phone" aria-hidden="true"></i>
      </div>
      <div class="number">
         8939014386
      </div>
     
   </div>
</div>


</div>
<div class="contact-form">
   <div class="form-detail" >
      
         <svg style="height: 65px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M399 384.2C376.9 345.8 335.4 320 288 320l-64 0c-47.4 0-88.9 25.8-111 64.2c35.2 39.2 86.2 63.8 143 63.8s107.8-24.7 143-63.8zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm256 16a72 72 0 1 0 0-144 72 72 0 1 0 0 144z"/></svg>
      
      <form action="#" (submit)="sendEmail($event)">

      
         <div class="inputbox" style="display: flex;">
         
            <input type="email" name="from_name" class="textbox" placeholder="Email">
         </div>
         
         <div class="inputbox1">
            <textarea class="textarea" name="message" placeholder="Enter a message  to Get started"></textarea>   
         </div>
          
         
      
         <button type="submit" class="btn1">Submit</button>
      </form>
   </div>

</div>
</div>
</div>
